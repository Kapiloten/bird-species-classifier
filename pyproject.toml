[project]
name = "bird-species-classifier"
version = "0.1.0"
description = "BirdCLEF audio classification with acoustic features, Perch embeddings and classical ML."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.5.2",
    "librosa>=0.11.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "soundfile>=0.13.1",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.1.1"]
plots = ["seaborn>=0.13.2", "umap-learn>=0.5.7"]
perch = [
    "tensorflow>=2.21,<2.22; python_version < '3.14'",
    "tensorflow-hub>=0.16.1; python_version < '3.14'",
    "tf-keras>=2.21,<2.22; python_version < '3.14'",
    "torch>=2.6; python_version < '3.14'",
    "tqdm>=4.67.1",
]

[project.urls]
Repository = "https://github.com/Kapiloten/bird-species-classifier"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# Focus on errors rather than reformatting the existing research scripts.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]  # Direct-file CLI entry points add scripts/ to sys.path.
